services:
  - type: web
    name: geohub-bot
    runtime: python
    plan: free
    buildCommand: pip3 install -r requirements.txt
    startCommand: python3 -u bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
